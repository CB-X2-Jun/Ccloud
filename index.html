<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>☁️ 我的云盘 · Netlify 版</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f6f8fa;
            color: #1f2328;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 28px 32px 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 18px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 600;
            color: #0d1117;
        }
        .logo i {
            color: #2d7aff;
            font-size: 26px;
        }
        .token-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .token-area label {
            font-size: 14px;
            font-weight: 500;
            color: #57606a;
        }
        .token-area .status {
            font-size: 13px;
            color: #3fb950;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .token-area .status i {
            font-size: 14px;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding: 6px 0;
        }
        .path-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 500;
            color: #1f2328;
            background: #f0f3f6;
            padding: 6px 16px;
            border-radius: 24px;
            flex: 1;
            min-width: 200px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .path-display i {
            color: #6e7781;
            font-size: 14px;
        }
        .path-display .path-text {
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: "SF Mono", "Cascadia Code", monospace;
            font-size: 15px;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-actions .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0f3f6;
            color: #1f2328;
            transition: background 0.2s, transform 0.1s;
        }
        .nav-actions .btn:hover {
            background: #e1e6ec;
        }
        .nav-actions .btn-primary {
            background: #2d7aff;
            color: #fff;
        }
        .nav-actions .btn-primary:hover {
            background: #1c6ae0;
        }
        .nav-actions .btn:active {
            transform: scale(0.95);
        }
        .drop-zone {
            border: 2.5px dashed #d0d7de;
            border-radius: 14px;
            padding: 36px 20px;
            text-align: center;
            color: #57606a;
            transition: border-color 0.25s, background 0.25s;
            margin-bottom: 22px;
            background: #fafbfc;
            cursor: pointer;
            position: relative;
        }
        .drop-zone.drag-over {
            border-color: #2d7aff;
            background: #f0f5ff;
        }
        .drop-zone i {
            font-size: 36px;
            color: #8d96a0;
            margin-bottom: 8px;
            display: block;
        }
        .drop-zone .hint {
            font-size: 15px;
            font-weight: 450;
        }
        .drop-zone .sub-hint {
            font-size: 13px;
            color: #8d96a0;
            margin-top: 4px;
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .list-container {
            border: 1px solid #eaeef2;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }
        .list-header {
            display: grid;
            grid-template-columns: 40px 1fr 140px 120px 1fr;
            padding: 10px 18px;
            background: #f6f8fa;
            font-size: 13px;
            font-weight: 600;
            color: #57606a;
            border-bottom: 1px solid #eaeef2;
            gap: 8px;
            align-items: center;
        }
        .list-header span:last-child {
            text-align: right;
        }
        .file-item {
            display: grid;
            grid-template-columns: 40px 1fr 140px 120px 1fr;
            padding: 10px 18px;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #f0f3f6;
            transition: background 0.12s;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item:hover {
            background: #f8faff;
        }
        .file-item .icon {
            font-size: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            color: #57606a;
        }
        .file-item .icon.folder-icon {
            color: #54a0ff;
        }
        .file-item .name {
            font-size: 15px;
            font-weight: 450;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: "SF Mono", "Cascadia Code", monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .file-item .name .ext-badge {
            font-size: 11px;
            background: #eaeef2;
            padding: 0 8px;
            border-radius: 12px;
            color: #57606a;
            font-weight: 400;
        }
        .file-item .type {
            font-size: 13px;
            color: #57606a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .size {
            font-size: 13px;
            color: #57606a;
            text-align: right;
            font-feature-settings: "tnum";
        }
        .file-item .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .file-item .actions .btn-sm {
            padding: 2px 12px;
            border: 1px solid #d0d7de;
            border-radius: 16px;
            background: transparent;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            color: #1f2328;
            font-weight: 450;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .file-item .actions .btn-sm:hover {
            background: #f0f3f6;
            border-color: #8d96a0;
        }
        .file-item .actions .btn-sm.primary {
            border-color: #2d7aff;
            color: #2d7aff;
        }
        .file-item .actions .btn-sm.primary:hover {
            background: #eef4ff;
            border-color: #1c6ae0;
        }
        .file-item .actions .btn-sm.danger {
            border-color: #cf222e;
            color: #cf222e;
        }
        .file-item .actions .btn-sm.danger:hover {
            background: #ffebe9;
            border-color: #a0111f;
        }
        .file-item .actions .btn-sm:active {
            transform: scale(0.94);
        }
        .file-item.is-folder {
            cursor: pointer;
        }
        .file-item.is-folder:hover .name {
            color: #2d7aff;
        }
        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: #8d96a0;
        }
        .empty-state i {
            font-size: 44px;
            color: #d0d7de;
            margin-bottom: 12px;
            display: block;
        }
        .empty-state p {
            font-size: 15px;
        }
        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #ffffff;
            border-radius: 18px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid #eaeef2;
        }
        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .modal-header h3 i {
            color: #2d7aff;
        }
        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #57606a;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .modal-header .close-btn:hover {
            background: #f0f3f6;
        }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "SF Mono", "Cascadia Code", monospace;
            min-height: 120px;
            max-height: 60vh;
        }
        .modal-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .modal-footer {
            padding: 14px 24px;
            border-top: 1px solid #eaeef2;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .modal-footer .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            background: #f0f3f6;
            color: #1f2328;
        }
        .modal-footer .btn-primary {
            background: #2d7aff;
            color: #fff;
        }
        .modal-footer .btn-primary:hover {
            background: #1c6ae0;
        }
        .modal-footer .btn:hover {
            background: #e1e6ec;
        }
        /* 对话框 */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 24px;
        }
        .dialog-overlay.active {
            display: flex;
        }
        .dialog {
            background: #ffffff;
            border-radius: 18px;
            padding: 28px 32px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.2s ease;
        }
        .dialog h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .dialog p {
            color: #57606a;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .dialog input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d0d7de;
            border-radius: 10px;
            font-size: 15px;
            background: #fafbfc;
            transition: border 0.2s;
            font-family: inherit;
        }
        .dialog input:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
        }
        .dialog .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        .dialog .dialog-actions .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .dialog .dialog-actions .btn-cancel {
            background: #f0f3f6;
            color: #1f2328;
        }
        .dialog .dialog-actions .btn-cancel:hover {
            background: #e1e6ec;
        }
        .dialog .dialog-actions .btn-confirm {
            background: #2d7aff;
            color: #fff;
        }
        .dialog .dialog-actions .btn-confirm:hover {
            background: #1c6ae0;
        }
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1f2328;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 450;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            pointer-events: auto;
            animation: toastIn 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast i {
            font-size: 16px;
        }
        .toast.success i {
            color: #3fb950;
        }
        .toast.error i {
            color: #f85149;
        }
        .toast.info i {
            color: #58a6ff;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.94);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* 响应式 */
        @media (max-width: 780px) {
            .app {
                padding: 16px 14px 28px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .token-area {
                flex-wrap: wrap;
            }
            .list-header {
                display: none;
            }
            .file-item {
                grid-template-columns: 36px 1fr auto;
                padding: 12px 14px;
                gap: 6px 10px;
                border-bottom: 1px solid #f0f3f6;
            }
            .file-item .type {
                display: none;
            }
            .file-item .size {
                grid-column: 3;
                grid-row: 1;
                text-align: right;
                font-size: 12px;
                color: #8d96a0;
            }
            .file-item .actions {
                grid-column: 1 / -1;
                grid-row: 2;
                justify-content: flex-start;
                padding-top: 4px;
                gap: 6px;
            }
            .file-item .icon {
                width: 28px;
                height: 28px;
                font-size: 18px;
            }
            .file-item .name {
                font-size: 14px;
            }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .path-display {
                width: 100%;
            }
            .nav-actions {
                justify-content: stretch;
            }
            .nav-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .drop-zone {
                padding: 24px 12px;
            }
            .modal {
                max-width: 96%;
                max-height: 92vh;
            }
            .modal-body {
                font-size: 13px;
                padding: 16px;
            }
        }
        @media (max-width: 480px) {
            .file-item .actions .btn-sm {
                font-size: 11px;
                padding: 2px 10px;
            }
            .file-item .actions .btn-sm span {
                display: none;
            }
            .file-item .actions .btn-sm i {
                font-size: 13px;
            }
        }
        .modal-body::-webkit-scrollbar {
            width: 5px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #f0f3f6;
            border-radius: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb:hover {
            background: #b0b8c0;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-cloud"></i>
                <span>我的云盘</span>
                <span style="font-size:13px;font-weight:400;color:#8d96a0;margin-left:2px;">· Netlify</span>
            </div>
            <div class="token-area">
                <span class="status" id="statusBadge"><i class="fas fa-check-circle"></i> 已连接</span>
            </div>
        </div>

        <!-- 导航 -->
        <div class="nav-bar">
            <div class="path-display">
                <i class="fas fa-folder-open"></i>
                <span class="path-text" id="pathDisplay">/</span>
            </div>
            <div class="nav-actions">
                <button class="btn" id="refreshBtn"><i class="fas fa-rotate"></i> 刷新</button>
                <button class="btn btn-primary" id="newFolderBtn"><i class="fas fa-folder-plus"></i> 新建文件夹</button>
            </div>
        </div>

        <!-- 上传区域 -->
        <div class="drop-zone" id="dropZone">
            <i class="fas fa-cloud-upload-alt"></i>
            <div class="hint">拖动文件到此处上传</div>
            <div class="sub-hint">或点击选择文件 · 上传到当前文件夹</div>
            <input type="file" id="fileInput" multiple />
        </div>

        <!-- 文件列表 -->
        <div class="list-container">
            <div class="list-header">
                <span></span>
                <span>名称</span>
                <span>类型</span>
                <span>大小</span>
                <span>操作</span>
            </div>
            <div id="fileList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>加载中…</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="previewTitle"><i class="fas fa-file"></i> 文件预览</h3>
                <button class="close-btn" id="previewCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="previewBody">
                <div class="preview-fallback">加载中…</div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="previewDownloadBtn"><i class="fas fa-download"></i> 下载</button>
                <button class="btn btn-primary" id="previewCloseBtn2">关闭</button>
            </div>
        </div>
    </div>

    <!-- 新建文件夹对话框 -->
    <div class="dialog-overlay" id="newFolderDialog">
        <div class="dialog">
            <h3><i class="fas fa-folder-plus" style="color:#2d7aff;"></i> 新建文件夹</h3>
            <p>在当前路径下创建新文件夹</p>
            <input type="text" id="folderNameInput" placeholder="输入文件夹名称" autofocus />
            <div class="dialog-actions">
                <button class="btn btn-cancel" id="dialogCancelBtn">取消</button>
                <button class="btn btn-confirm" id="dialogConfirmBtn">创建</button>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  配置（后端 Functions 端点）
            // ============================================================
            const API_BASE = '/.netlify/functions';

            // ============================================================
            //  文件类型映射（用于 UI 显示）
            // ============================================================
            const TYPE_MAP = {
                'txt': { name: '文本文件', icon: 'fa-regular fa-file-lines', preview: true },
                'log': { name: '日志文件', icon: 'fa-regular fa-file-lines', preview: true },
                'md': { name: 'Markdown', icon: 'fa-regular fa-file-lines', preview: true },
                'json': { name: 'JSON 数据', icon: 'fa-regular fa-file-code', preview: true },
                'xml': { name: 'XML 文档', icon: 'fa-regular fa-file-code', preview: true },
                'yaml': { name: 'YAML 配置', icon: 'fa-regular fa-file-code', preview: true },
                'yml': { name: 'YAML 配置', icon: 'fa-regular fa-file-code', preview: true },
                'toml': { name: 'TOML 配置', icon: 'fa-regular fa-file-code', preview: true },
                'csv': { name: 'CSV 表格', icon: 'fa-regular fa-file-csv', preview: true },
                'js': { name: 'JavaScript 源码', icon: 'fa-brands fa-js', preview: true },
                'ts': { name: 'TypeScript 源码', icon: 'fa-regular fa-file-code', preview: true },
                'jsx': { name: 'React JSX', icon: 'fa-brands fa-react', preview: true },
                'tsx': { name: 'React TSX', icon: 'fa-brands fa-react', preview: true },
                'html': { name: 'HTML 文档', icon: 'fa-brands fa-html5', preview: true },
                'css': { name: 'CSS 样式', icon: 'fa-brands fa-css3-alt', preview: true },
                'scss': { name: 'SCSS 样式', icon: 'fa-regular fa-file-code', preview: true },
                'less': { name: 'Less 样式', icon: 'fa-regular fa-file-code', preview: true },
                'py': { name: 'Python 源码', icon: 'fa-brands fa-python', preview: true },
                'java': { name: 'Java 源码', icon: 'fa-brands fa-java', preview: true },
                'c': { name: 'C 源码', icon: 'fa-regular fa-file-code', preview: true },
                'cpp': { name: 'C++ 源码', icon: 'fa-regular fa-file-code', preview: true },
                'h': { name: 'C/C++ 头文件', icon: 'fa-regular fa-file-code', preview: true },
                'hpp': { name: 'C++ 头文件', icon: 'fa-regular fa-file-code', preview: true },
                'go': { name: 'Go 源码', icon: 'fa-brands fa-golang', preview: true },

                '7z': { name: '7-Zip 压缩包', icon: 'fa-regular fa-file-zipper', preview: false },
                'tar': { name: 'TAR 归档', icon: 'fa-regular fa-file-zipper', preview: false },
                'gz': { name: 'GZ 压缩', icon: 'fa-regular fa-file-zipper', preview: false },
                'bz2': { name: 'BZ2 压缩', icon: 'fa-regular fa-file-zipper', preview: false },
                'exe': { name: '应用程序', icon: 'fa-regular fa-file', preview: false },
                'msi': { name: '安装包', icon: 'fa-regular fa-file', preview: false },
                'app': { name: '应用程序', icon: 'fa-regular fa-file', preview: false },
                'dmg': { name: '磁盘镜像', icon: 'fa-regular fa-file', preview: false },
                'deb': { name: 'Debian 包', icon: 'fa-regular fa-file', preview: false },
                'rpm': { name: 'RPM 包', icon: 'fa-regular fa-file', preview: false },
                'gitkeep': { name: '占位文件', icon: 'fa-regular fa-file', preview: false },
            };
            const UNKNOWN_TYPE = { name: '未知文件类型', icon: 'fa-regular fa-file', preview: true };

            // ============================================================
            //  状态
            // ============================================================
            let currentPath = '/';
            let allAssets = []; // 缓存所有资产 { name, size, download_url }

            // DOM 引用
            const $ = (s) => document.querySelector(s);
            const $$ = (s) => document.querySelectorAll(s);

            const pathDisplay = $('#pathDisplay');
            const fileListEl = $('#fileList');
            const refreshBtn = $('#refreshBtn');
            const newFolderBtn = $('#newFolderBtn');
            const dropZone = $('#dropZone');
            const fileInput = $('#fileInput');

            const previewModal = $('#previewModal');
            const previewTitle = $('#previewTitle');
            const previewBody = $('#previewBody');
            const previewCloseBtn = $('#previewCloseBtn');
            const previewCloseBtn2 = $('#previewCloseBtn2');
            const previewDownloadBtn = $('#previewDownloadBtn');

            const newFolderDialog = $('#newFolderDialog');
            const folderNameInput = $('#folderNameInput');
            const dialogCancelBtn = $('#dialogCancelBtn');
            const dialogConfirmBtn = $('#dialogConfirmBtn');

            const toastContainer = $('#toastContainer');

            // ============================================================
            //  工具函数
            // ============================================================
            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                const val = (bytes / Math.pow(k, i));
                return (i === 0 ? val : val.toFixed(2)) + ' ' + sizes[i];
            }

            function getFileType(filename) {
                const dot = filename.lastIndexOf('.');
                if (dot === -1 || dot === filename.length - 1) return UNKNOWN_TYPE;
                const ext = filename.slice(dot + 1).toLowerCase();
                return TYPE_MAP[ext] || UNKNOWN_TYPE;
            }

            function getIconHtml(filename, isFolder) {
                if (isFolder) {
                    return '<i class="fas fa-folder" style="color:#54a0ff;"></i>';
                }
                const info = getFileType(filename);
                return `<i class="${info.icon}"></i>`;
            }

            function getTypeName(filename, isFolder) {
                if (isFolder) return '文件夹';
                return getFileType(filename).name;
            }

            function canPreview(filename) {
                if (!filename) return false;
                return getFileType(filename).preview === true;
            }

            function getExtension(filename) {
                const dot = filename.lastIndexOf('.');
                if (dot === -1 || dot === filename.length - 1) return '';
                return filename.slice(dot + 1).toLowerCase();
            }

            function sanitizePath(path) {
                if (!path.startsWith('/')) path = '/' + path;
                if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
                return path;
            }

            function joinPath(parent, child) {
                if (parent === '/') return '/' + child;
                return parent + '/' + child;
            }

            function getParentPath(path) {
                if (path === '/') return '/';
                const parts = path.split('/').filter(Boolean);
                parts.pop();
                return '/' + parts.join('/');
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            //  Toast
            // ============================================================
            function showToast(message, type = 'info', duration = 3200) {
                const iconMap = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    info: 'fa-info-circle',
                };
                const el = document.createElement('div');
                el.className = `toast ${type}`;
                el.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
                toastContainer.appendChild(el);
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                }, duration);
            }

            // ============================================================
            //  API 调用（Netlify Functions）
            // ============================================================
            async function fetchList() {
                const resp = await fetch(`${API_BASE}/list`);
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || `列表获取失败 (${resp.status})`);
                }
                const data = await resp.json();
                return data.items || [];
            }

            async function uploadFileViaFunction(path, base64Content) {
                const resp = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path, content: base64Content })
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || `上传失败 (${resp.status})`);
                }
                return resp.json();
            }

            async function deleteFileViaFunction(path, password) {
                const resp = await fetch(`${API_BASE}/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path, password })
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || `删除失败 (${resp.status})`);
                }
                return resp.json();
            }

            // ============================================================
            //  核心：加载目录（基于缓存 allAssets）
            // ============================================================
            async function loadDirectory(path) {
                const cleanPath = sanitizePath(path);
                currentPath = cleanPath;
                pathDisplay.textContent = cleanPath;

                try {
                    // 获取最新资产列表
                    allAssets = await fetchList();
                    // 构建当前路径下的目录结构
                    const prefix = cleanPath === '/' ? '' : cleanPath.slice(1) + '/';
                    const foldersSet = new Set();
                    const children = [];

                    // 收集所有路径
                    for (const asset of allAssets) {
                        const name = asset.name;
                        if (!name.startsWith(prefix)) continue;
                        const relative = name.slice(prefix.length);
                        if (!relative) continue;
                        // 如果包含 '/'，说明是子文件夹内的文件
                        if (relative.includes('/')) {
                            const folderName = relative.split('/')[0];
                            foldersSet.add(folderName);
                        } else {
                            // 直接文件
                            children.push({
                                name: relative,
                                path: name,
                                size: asset.size,
                                download_url: asset.download_url,
                                type: 'file'
                            });
                        }
                    }

                    // 文件夹列表
                    const folderItems = Array.from(foldersSet).map(name => ({
                        name: name,
                        path: prefix + name,
                        type: 'dir',
                        size: 0,
                        download_url: null
                    }));

                    // 排序
                    folderItems.sort((a, b) => a.name.localeCompare(b.name));
                    children.sort((a, b) => a.name.localeCompare(b.name));

                    const items = [...folderItems, ...children];
                    renderFileList(items, cleanPath);
                } catch (err) {
                    console.error(err);
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:#cf222e;"></i>
                            <p>加载失败: ${err.message}</p>
                        </div>
                    `;
                    showToast('加载失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  渲染
            // ============================================================
            function renderFileList(items, path) {
                if (!items || items.length === 0) {
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>此文件夹为空</p>
                            <p style="font-size:13px;color:#8d96a0;margin-top:4px;">点击「新建文件夹」或拖拽文件上传</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const item of items) {
                    const isFolder = (item.type === 'dir');
                    const name = item.name;
                    const size = item.size || 0;
                    const typeName = getTypeName(name, isFolder);
                    const iconHtml = getIconHtml(name, isFolder);
                    const sizeStr = isFolder ? '—' : formatSize(size);
                    const ext = getExtension(name);
                    const extBadge = ext ? `<span class="ext-badge">.${ext}</span>` : '';

                    let actionsHtml = '';
                    if (isFolder) {
                        actionsHtml = `<span style="font-size:12px;color:#8d96a0;"><i class="fas fa-chevron-right"></i></span>`;
                    } else {
                        const canPrev = canPreview(name);
                        if (canPrev) {
                            actionsHtml +=
                                `<button class="btn-sm primary" data-action="preview" data-path="${item.path}" data-name="${name}"><i class="fas fa-eye"></i> <span>预览</span></button>`;
                        }
                        actionsHtml +=
                            `<button class="btn-sm" data-action="download" data-path="${item.path}" data-name="${name}" data-url="${item.download_url || ''}"><i class="fas fa-download"></i> <span>下载</span></button>`;
                        // 删除按钮
                        actionsHtml +=
                            `<button class="btn-sm danger" data-action="delete" data-path="${item.path}" data-name="${name}"><i class="fas fa-trash"></i> <span>删除</span></button>`;
                    }

                    const rowClass = isFolder ? 'file-item is-folder' : 'file-item';
                    const clickAttr = isFolder ? `data-folder="${item.path}"` : '';

                    html += `
                        <div class="${rowClass}" ${clickAttr}>
                            <div class="icon">${iconHtml}</div>
                            <div class="name">${name} ${extBadge}</div>
                            <div class="type">${typeName}</div>
                            <div class="size">${sizeStr}</div>
                            <div class="actions">${actionsHtml}</div>
                        </div>
                    `;
                }

                fileListEl.innerHTML = html;

                // 事件绑定：点击文件夹
                fileListEl.querySelectorAll('.file-item.is-folder').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.actions')) return;
                        const folderPath = this.dataset.folder;
                        if (folderPath) {
                            navigateTo(folderPath);
                        }
                    });
                });

                // 预览
                fileListEl.querySelectorAll('[data-action="preview"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const path = this.dataset.path;
                        const name = this.dataset.name;
                        if (path) handlePreview(path, name);
                    });
                });

                // 下载
                fileListEl.querySelectorAll('[data-action="download"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const url = this.dataset.url;
                        const name = this.dataset.name;
                        if (url) handleDownload(url, name);
                        else showToast('下载链接无效', 'error');
                    });
                });

                // 删除
                fileListEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const path = this.dataset.path;
                        const name = this.dataset.name;
                        if (path) handleDelete(path, name);
                    });
                });
            }

            // ============================================================
            //  导航
            // ============================================================
            function navigateTo(path) {
                const clean = sanitizePath(path);
                if (clean !== currentPath) {
                    loadDirectory(clean);
                }
            }

            // ============================================================
            //  新建文件夹（通过上传空的 .gitkeep）
            // ============================================================
            async function createFolder(folderName) {
                if (!folderName || folderName.trim() === '') {
                    showToast('请输入文件夹名称', 'error');
                    return;
                }
                const name = folderName.trim();
                if (/[\/:*?"<>|\\]/.test(name)) {
                    showToast('文件夹名称包含非法字符', 'error');
                    return;
                }
                const folderPath = currentPath === '/' ? `/${name}` : `${currentPath}/${name}`;
                const keepPath = currentPath === '/' ? `${name}/.gitkeep` : `${currentPath.slice(1)}/${name}/.gitkeep`;

                try {
                    // 空 base64 (空文件)
                    const emptyBase64 = btoa(' '); // 至少包含一个空格
                    await uploadFileViaFunction(keepPath, emptyBase64);
                    showToast(`文件夹 "${name}" 创建成功`, 'success');
                    newFolderDialog.classList.remove('active');
                    loadDirectory(currentPath);
                } catch (err) {
                    showToast('创建失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  上传文件
            // ============================================================
            async function uploadFiles(files) {
                if (!files || files.length === 0) return;

                let success = 0;
                let failed = 0;

                for (const file of files) {
                    try {
                        const reader = new FileReader();
                        const base64 = await new Promise((resolve, reject) => {
                            reader.onload = () => {
                                // 去掉 data:xxx;base64, 前缀
                                const raw = reader.result.split(',')[1] || reader.result;
                                resolve(raw);
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });

                        const targetPath = currentPath === '/' ? file.name : `${currentPath.slice(1)}/${file.name}`;
                        await uploadFileViaFunction(targetPath, base64);
                        success++;
                    } catch (err) {
                        failed++;
                        console.error(`上传 ${file.name} 失败:`, err);
                        showToast(`上传失败: ${file.name} — ${err.message}`, 'error');
                    }
                }

                if (success > 0) {
                    showToast(`成功上传 ${success} 个文件${failed > 0 ? `，${failed} 个失败` : ''}`, success === files.length ? 'success' :
                        'info');
                    loadDirectory(currentPath);
                } else if (failed > 0) {
                    showToast(`上传失败 ${failed} 个文件`, 'error');
                }
            }

            // ============================================================
            //  预览
            // ============================================================
            async function handlePreview(path, name) {
              try {
                // 通过 Function 代理获取内容
                const resp = await fetch(`${API_BASE}/preview?path=${encodeURIComponent(path)}`);
                if (!resp.ok) {
                  const err = await resp.json().catch(() => ({}));
                  throw new Error(err.error || `预览失败 (${resp.status})`);
                }
                const data = await resp.json();
                const content = data.content;
            
                const info = getFileType(name);
                const ext = getExtension(name);
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp', 'bmp', 'ico'].includes(ext);
            
                previewTitle.innerHTML = `<i class="${info.icon}"></i> ${name}`;
                let bodyHtml = '';
                if (isImage) {
                  // 图片直接使用下载链接显示（无需代理）
                  const asset = allAssets.find(a => a.name === path);
                  if (asset) {
                    bodyHtml = `<img src="${asset.download_url}" alt="${name}" />`;
                  } else {
                    bodyHtml = `<div class="preview-fallback">无法获取图片链接</div>`;
                  }
                } else {
                  bodyHtml = `<pre style="margin:0;font-family:inherit;white-space:pre-wrap;word-break:break-word;">${escapeHtml(content)}</pre>`;
                }
                previewBody.innerHTML = bodyHtml;
                previewModal.classList.add('active');
                previewModal.dataset.path = path;
              } catch (err) {
                showToast('预览失败: ' + err.message, 'error');
              }
            }
            // ============================================================
            //  下载（直接使用下载链接）
            // ============================================================
            function handleDownload(url, name) {
              if (!url) {
                showToast('下载链接无效', 'error');
                return;
              }
              const a = document.createElement('a');
              a.href = url;
              a.download = name;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }

            // ============================================================
            //  删除（需要管理员密码）
            // ============================================================
            async function handleDelete(path, name) {
                const password = prompt('请输入管理员密码以删除文件：');
                if (password === null) return; // 取消
                if (!password.trim()) {
                    showToast('密码不能为空', 'error');
                    return;
                }
                try {
                    await deleteFileViaFunction(path, password.trim());
                    showToast(`文件 "${name}" 已删除`, 'success');
                    loadDirectory(currentPath);
                } catch (err) {
                    showToast('删除失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  事件绑定
            // ============================================================

            // 刷新
            refreshBtn.addEventListener('click', () => loadDirectory(currentPath));

            // 新建文件夹
            newFolderBtn.addEventListener('click', () => {
                newFolderDialog.classList.add('active');
                folderNameInput.value = '';
                setTimeout(() => folderNameInput.focus(), 100);
            });

            dialogCancelBtn.addEventListener('click', () => {
                newFolderDialog.classList.remove('active');
            });

            dialogConfirmBtn.addEventListener('click', () => {
                const name = folderNameInput.value.trim();
                if (name) createFolder(name);
                else showToast('请输入文件夹名称', 'error');
            });

            folderNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') dialogConfirmBtn.click();
                if (e.key === 'Escape') dialogCancelBtn.click();
            });

            newFolderDialog.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) newFolderDialog.classList.remove('active');
            });

            // 上传
            dropZone.addEventListener('click', (e) => {
                if (e.target.closest('input')) return;
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                if (this.files && this.files.length > 0) {
                    uploadFiles(this.files);
                    this.value = '';
                }
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    uploadFiles(files);
                }
            });

            // 预览模态框关闭
            function closePreview() {
                previewModal.classList.remove('active');
                delete previewModal.dataset.path;
            }
            previewCloseBtn.addEventListener('click', closePreview);
            previewCloseBtn2.addEventListener('click', closePreview);
            previewModal.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closePreview();
            });

            // 预览中的下载按钮
            previewDownloadBtn.addEventListener('click', function() {
                const path = previewModal.dataset.path;
                if (!path) {
                    showToast('无法获取文件路径', 'error');
                    return;
                }
                const asset = allAssets.find(a => a.name === path);
                if (asset) {
                    handleDownload(asset.download_url, asset.name);
                } else {
                    showToast('文件信息丢失', 'error');
                }
            });

            // ESC 关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (previewModal.classList.contains('active')) closePreview();
                    if (newFolderDialog.classList.contains('active')) newFolderDialog.classList.remove('active');
                }
            });

            // ============================================================
            //  初始化
            // ============================================================
            loadDirectory('/');
        })();
    </script>
