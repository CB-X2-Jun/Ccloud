<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>☁️ 我的云盘 · Netlify 版</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f6f8fa;
            color: #1f2328;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 28px 32px 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 18px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 600;
            color: #0d1117;
        }
        .logo i {
            color: #2d7aff;
            font-size: 26px;
        }
        .token-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .token-area label {
            font-size: 14px;
            font-weight: 500;
            color: #57606a;
        }
        .token-area .status {
            font-size: 13px;
            color: #3fb950;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .token-area .status i {
            font-size: 14px;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding: 6px 0;
        }
        .path-display {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 500;
            color: #1f2328;
            background: #f0f3f6;
            padding: 6px 16px;
            border-radius: 24px;
            flex: 1;
            min-width: 200px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .path-display i {
            color: #6e7781;
            font-size: 14px;
        }
        .path-display .path-text {
            display: flex;
            align-items: center;
            gap: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: "SF Mono", "Cascadia Code", monospace;
            font-size: 15px;
            min-width: 0;
        }
        .path-display .crumb {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            color: #57606a;
            white-space: nowrap;
            transition: background 0.12s, color 0.12s;
        }
        .path-display .crumb:hover {
            color: #2d7aff;
            background: #e1e6ec;
        }
        .path-display .crumb.current {
            color: #1f2328;
            font-weight: 600;
            cursor: default;
        }
        .path-display .crumb.current:hover {
            color: #1f2328;
            background: transparent;
        }
        .path-display .crumb-sep {
            color: #8d96a0;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-actions .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0f3f6;
            color: #1f2328;
            transition: background 0.2s, transform 0.1s;
        }
        .nav-actions .btn:hover {
            background: #e1e6ec;
        }
        .nav-actions .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .nav-actions .btn:disabled:hover {
            background: #f0f3f6;
        }
        .nav-actions .btn-primary {
            background: #2d7aff;
            color: #fff;
        }
        .nav-actions .btn-primary:hover {
            background: #1c6ae0;
        }
        .nav-actions .btn:active {
            transform: scale(0.95);
        }
        .drop-zone {
            border: 2.5px dashed #d0d7de;
            border-radius: 14px;
            padding: 36px 20px;
            text-align: center;
            color: #57606a;
            transition: border-color 0.25s, background 0.25s;
            margin-bottom: 22px;
            background: #fafbfc;
            cursor: pointer;
            position: relative;
        }
        .drop-zone.drag-over {
            border-color: #2d7aff;
            background: #f0f5ff;
        }
        .drop-zone i {
            font-size: 36px;
            color: #8d96a0;
            margin-bottom: 8px;
            display: block;
        }
        .drop-zone .hint {
            font-size: 15px;
            font-weight: 450;
        }
        .drop-zone .sub-hint {
            font-size: 13px;
            color: #8d96a0;
            margin-top: 4px;
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .list-container {
            border: 1px solid #eaeef2;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }
        .list-header {
            display: grid;
            grid-template-columns: 40px 1fr 140px 120px 1fr;
            padding: 10px 18px;
            background: #f6f8fa;
            font-size: 13px;
            font-weight: 600;
            color: #57606a;
            border-bottom: 1px solid #eaeef2;
            gap: 8px;
            align-items: center;
        }
        .list-header span:last-child {
            text-align: right;
        }
        .file-item {
            display: grid;
            grid-template-columns: 40px 1fr 140px 120px 1fr;
            padding: 10px 18px;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #f0f3f6;
            transition: background 0.12s;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item:hover {
            background: #f8faff;
        }
        .file-item .icon {
            font-size: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            color: #57606a;
        }
        .file-item .icon.folder-icon {
            color: #54a0ff;
        }
        .file-item .name {
            font-size: 15px;
            font-weight: 450;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: "SF Mono", "Cascadia Code", monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .file-item .name .ext-badge {
            font-size: 11px;
            background: #eaeef2;
            padding: 0 8px;
            border-radius: 12px;
            color: #57606a;
            font-weight: 400;
        }
        .file-item .type {
            font-size: 13px;
            color: #57606a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .size {
            font-size: 13px;
            color: #57606a;
            text-align: right;
            font-feature-settings: "tnum";
        }
        .file-item .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .file-item .actions .btn-sm {
            padding: 2px 12px;
            border: 1px solid #d0d7de;
            border-radius: 16px;
            background: transparent;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            color: #1f2328;
            font-weight: 450;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .file-item .actions .btn-sm:hover {
            background: #f0f3f6;
            border-color: #8d96a0;
        }
        .file-item .actions .btn-sm.primary {
            border-color: #2d7aff;
            color: #2d7aff;
        }
        .file-item .actions .btn-sm.primary:hover {
            background: #eef4ff;
            border-color: #1c6ae0;
        }
        .file-item .actions .btn-sm.danger {
            border-color: #cf222e;
            color: #cf222e;
        }
        .file-item .actions .btn-sm.danger:hover {
            background: #ffebe9;
            border-color: #a0111f;
        }
        .file-item .actions .btn-sm:active {
            transform: scale(0.94);
        }
        .file-item.is-folder {
            cursor: pointer;
        }
        .file-item.is-folder:hover .name {
            color: #2d7aff;
        }
        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: #8d96a0;
        }
        .empty-state i {
            font-size: 44px;
            color: #d0d7de;
            margin-bottom: 12px;
            display: block;
        }
        .empty-state p {
            font-size: 15px;
        }
        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #ffffff;
            border-radius: 18px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid #eaeef2;
        }
        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .modal-header h3 i {
            color: #2d7aff;
        }
        .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #57606a;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .modal-header .close-btn:hover {
            background: #f0f3f6;
        }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "SF Mono", "Cascadia Code", monospace;
            min-height: 120px;
            max-height: 60vh;
        }
        .modal-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .modal-body video {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .modal-body .preview-fallback {
            text-align: center;
            color: #8d96a0;
            padding: 36px 12px;
        }
        .modal-body .preview-fallback i {
            font-size: 30px;
            color: #d0d7de;
            display: block;
            margin-bottom: 10px;
        }
        .modal-footer {
            padding: 14px 24px;
            border-top: 1px solid #eaeef2;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .modal-footer .btn {
            padding: 8px 22px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            background: #f0f3f6;
            color: #1f2328;
        }
        .modal-footer .btn-primary {
            background: #2d7aff;
            color: #fff;
        }
        .modal-footer .btn-primary:hover {
            background: #1c6ae0;
        }
        .modal-footer .btn:hover {
            background: #e1e6ec;
        }
        /* 对话框 */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 24px;
        }
        .dialog-overlay.active {
            display: flex;
        }
        .dialog {
            background: #ffffff;
            border-radius: 18px;
            padding: 28px 32px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.2s ease;
        }
        .dialog h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .dialog p {
            color: #57606a;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .dialog input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d0d7de;
            border-radius: 10px;
            font-size: 15px;
            background: #fafbfc;
            transition: border 0.2s;
            font-family: inherit;
        }
        .dialog input:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
        }
        .dialog .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }
        .dialog .dialog-actions .btn {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .dialog .dialog-actions .btn-cancel {
            background: #f0f3f6;
            color: #1f2328;
        }
        .dialog .dialog-actions .btn-cancel:hover {
            background: #e1e6ec;
        }
        .dialog .dialog-actions .btn-confirm {
            background: #2d7aff;
            color: #fff;
        }
        .dialog .dialog-actions .btn-confirm:hover {
            background: #1c6ae0;
        }
        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1f2328;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 450;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            pointer-events: auto;
            animation: toastIn 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast i {
            font-size: 16px;
        }
        .toast.success i {
            color: #3fb950;
        }
        .toast.error i {
            color: #f85149;
        }
        .toast.info i {
            color: #58a6ff;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.94);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* 响应式 */
        @media (max-width: 780px) {
            .app {
                padding: 16px 14px 28px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .token-area {
                flex-wrap: wrap;
            }
            .list-header {
                display: none;
            }
            .file-item {
                grid-template-columns: 36px 1fr auto;
                padding: 12px 14px;
                gap: 6px 10px;
                border-bottom: 1px solid #f0f3f6;
            }
            .file-item .type {
                display: none;
            }
            .file-item .size {
                grid-column: 3;
                grid-row: 1;
                text-align: right;
                font-size: 12px;
                color: #8d96a0;
            }
            .file-item .actions {
                grid-column: 1 / -1;
                grid-row: 2;
                justify-content: flex-start;
                padding-top: 4px;
                gap: 6px;
            }
            .file-item .icon {
                width: 28px;
                height: 28px;
                font-size: 18px;
            }
            .file-item .name {
                font-size: 14px;
            }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .path-display {
                width: 100%;
            }
            .nav-actions {
                justify-content: stretch;
            }
            .nav-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .drop-zone {
                padding: 24px 12px;
            }
            .modal {
                max-width: 96%;
                max-height: 92vh;
            }
            .modal-body {
                font-size: 13px;
                padding: 16px;
            }
        }
        @media (max-width: 480px) {
            .file-item .actions .btn-sm {
                font-size: 11px;
                padding: 2px 10px;
            }
            .file-item .actions .btn-sm span {
                display: none;
            }
            .file-item .actions .btn-sm i {
                font-size: 13px;
            }
        }
        .modal-body::-webkit-scrollbar {
            width: 5px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #f0f3f6;
            border-radius: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 4px;
        }
        .modal-body::-webkit-scrollbar-thumb:hover {
            background: #b0b8c0;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-cloud"></i>
                <span>我的云盘</span>
                <span style="font-size:13px;font-weight:400;color:#8d96a0;margin-left:2px;">· Netlify</span>
            </div>
            <div class="token-area">
                <span class="status" id="statusBadge"><i class="fas fa-check-circle"></i> 已连接</span>
            </div>
        </div>

        <!-- 导航 -->
        <div class="nav-bar">
            <div class="path-display">
                <i class="fas fa-folder-open"></i>
                <div class="path-text" id="pathDisplay"></div>
            </div>
            <div class="nav-actions">
                <button class="btn" id="upBtn" title="返回上级目录"><i class="fas fa-level-up-alt"></i> 上一级</button>
                <button class="btn" id="refreshBtn"><i class="fas fa-rotate"></i> 刷新</button>
                <button class="btn btn-primary" id="newFolderBtn"><i class="fas fa-folder-plus"></i> 新建文件夹</button>
            </div>
        </div>

        <!-- 上传区域 -->
        <div class="drop-zone" id="dropZone">
            <i class="fas fa-cloud-upload-alt"></i>
            <div class="hint">拖动文件到此处上传</div>
            <div class="sub-hint">或点击选择文件 · 上传到当前文件夹</div>
            <input type="file" id="fileInput" multiple />
        </div>

        <!-- 文件列表 -->
        <div class="list-container">
            <div class="list-header">
                <span></span>
                <span>名称</span>
                <span>类型</span>
                <span>大小</span>
                <span>操作</span>
            </div>
            <div id="fileList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>加载中…</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="previewTitle"><i class="fas fa-file"></i> 文件预览</h3>
                <button class="close-btn" id="previewCloseBtn">&times;</button>
            </div>
            <div class="modal-body" id="previewBody">
                <div class="preview-fallback">加载中…</div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="previewDownloadBtn"><i class="fas fa-download"></i> 下载</button>
                <button class="btn btn-primary" id="previewCloseBtn2">关闭</button>
            </div>
        </div>
    </div>

    <!-- 新建文件夹对话框 -->
    <div class="dialog-overlay" id="newFolderDialog">
        <div class="dialog">
            <h3><i class="fas fa-folder-plus" style="color:#2d7aff;"></i> 新建文件夹</h3>
            <p>在当前路径下创建新文件夹</p>
            <input type="text" id="folderNameInput" placeholder="输入文件夹名称" autofocus />
            <div class="dialog-actions">
                <button class="btn btn-cancel" id="dialogCancelBtn">取消</button>
                <button class="btn btn-confirm" id="dialogConfirmBtn">创建</button>
            </div>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  配置（后端 Functions 端点）
            // ============================================================
            const API_BASE = '/.netlify/functions';

            // ============================================================
            //  文件类型映射（用于 UI 显示）
            // ============================================================
            const TYPE_MAP = {
                'txt': { name: '文本文件', icon: 'fa-regular fa-file-lines', preview: true },
                'log': { name: '日志文件', icon: 'fa-regular fa-file-lines', preview: true },
                'md': { name: 'Markdown', icon: 'fa-regular fa-file-lines', preview: true },
                'json': { name: 'JSON 数据', icon: 'fa-regular fa-file-code', preview: true },
                'xml': { name: 'XML 文档', icon: 'fa-regular fa-file-code', preview: true },
                'yaml': { name: 'YAML 配置', icon: 'fa-regular fa-file-code', preview: true },
                'yml': { name: 'YAML 配置', icon: 'fa-regular fa-file-code', preview: true },

            // ============================================================
            //  工具函数
            // ============================================================
            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                const val = (bytes / Math.pow(k, i));
                return (i === 0 ? val : val.toFixed(2)) + ' ' + sizes[i];
            }

            function getFileType(filename) {
                const dot = filename.lastIndexOf('.');
                if (dot === -1 || dot === filename.length - 1) return UNKNOWN_TYPE;
                const ext = filename.slice(dot + 1).toLowerCase();
                return TYPE_MAP[ext] || UNKNOWN_TYPE;
            }

            function getIconHtml(filename, isFolder) {
                if (isFolder) {
                    return '<i class="fas fa-folder" style="color:#54a0ff;"></i>';
                }
                const info = getFileType(filename);
                return `<i class="${info.icon}"></i>`;
            }

            function getTypeName(filename, isFolder) {
                if (isFolder) return '文件夹';
                return getFileType(filename).name;
            }

            function canPreview(filename) {
                if (!filename) return false;
                return getFileType(filename).preview === true;
            }

            function getExtension(filename) {
                const dot = filename.lastIndexOf('.');
                if (dot === -1 || dot === filename.length - 1) return '';
                return filename.slice(dot + 1).toLowerCase();
            }

            function sanitizePath(path) {
                if (!path.startsWith('/')) path = '/' + path;
                if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
                return path;
            }

            function joinPath(parent, child) {
                if (parent === '/') return '/' + child;
                return parent + '/' + child;
            }

            function getParentPath(path) {
                if (path === '/') return '/';
                const parts = path.split('/').filter(Boolean);
                parts.pop();
                return '/' + parts.join('/');
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================

            function showToast(message, type = 'info', duration = 3200) {
                const iconMap = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    info: 'fa-info-circle',
                };
                const el = document.createElement('div');
                el.className = `toast ${type}`;
                el.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
                toastContainer.appendChild(el);
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                }, duration);
            }

            // ============================================================
            //  面包屑导航 + 返回上级
            // ============================================================
            function renderBreadcrumb() {
                pathDisplay.innerHTML = '';
                const home = document.createElement('span');
                const homeIcon = document.createElement('i');
                homeIcon.className = 'fas fa-home';
                home.appendChild(homeIcon);
                if (currentPath === '/') {
                    home.className = 'crumb current';
                    home.appendChild(document.createTextNode(' 全部文件'));
                } else {
                    home.className = 'crumb';
                    home.title = '返回主目录';
                    home.addEventListener('click', () => navigateTo('/'));
                }
                pathDisplay.appendChild(home);

                let acc = '';
                const parts = currentPath === '/' ? [] : currentPath.slice(1).split('/');
                parts.forEach((part, i) => {
                    acc += '/' + part;
                    const sep = document.createElement('span');
                    sep.className = 'crumb-sep';
                    sep.textContent = '/';
                    pathDisplay.appendChild(sep);

                    const crumb = document.createElement('span');
                    const isLast = (i === parts.length - 1);
                    crumb.className = 'crumb' + (isLast ? ' current' : '');
                    crumb.textContent = part;
                    if (!isLast) {
                        const target = acc;
                        crumb.title = '返回 ' + target;
                        crumb.addEventListener('click', () => navigateTo(target));
                    }
                    pathDisplay.appendChild(crumb);
                });
                upBtn.disabled = (currentPath === '/');
            }

            // ============================================================
            //  核心：加载目录（基于缓存 allAssets）
            // ============================================================
            async function loadDirectory(path) {
                const cleanPath = sanitizePath(path);
                currentPath = cleanPath;
                renderBreadcrumb();

                try {
                    allAssets = await fetchList();
                    const prefix = cleanPath === '/' ? '' : cleanPath.slice(1) + '/';
                    const foldersSet = new Set();
                    const children = [];

                    for (const asset of allAssets) {
                        const name = asset.name; // 逻辑路径（list.js 已解码）
                        if (!name.startsWith(prefix)) continue;
                        const relative = name.slice(prefix.length);
                        if (!relative) continue;

                        // 当前目录自身的占位文件
                        if (relative === '.keep' || relative === '.gitkeep') continue;

                        // 子目录占位文件：xxx/.keep（或旧版 xxx/.gitkeep）
                        if (/\/\.(keep|gitkeep)$/.test(relative)) {
                            const folderPath = relative.replace(/\/\.(keep|gitkeep)$/, '');
                            if (folderPath && !folderPath.includes('/')) {
                                foldersSet.add(folderPath);
                            }
                            continue;
                        }

                        // 旧版遗留：GitHub 曾把 "文件夹/.gitkeep" 改名成 "文件夹.gitkeep"
                        if (/^[^/]+\.gitkeep$/.test(relative)) {
                            foldersSet.add(relative.replace(/\.gitkeep$/, ''));
                            continue;
                        }

                        // 普通文件：包含 "/" 说明位于子目录，取第一段作为子文件夹名
                        if (relative.includes('/')) {
                            foldersSet.add(relative.split('/')[0]);
                        } else {
                            children.push({
                                name: relative,
                                path: name,
                                size: asset.size,
                                download_url: asset.download_url,
                                type: 'file'
                            });
                        }
                    }

                    // 构建文件夹列表
                    const folderItems = Array.from(foldersSet).map(name => ({
                        name: name,
                        path: prefix + name,
                        type: 'dir',
                        size: 0,
                        download_url: null
                    }));

                    folderItems.sort((a, b) => a.name.localeCompare(b.name));
                    children.sort((a, b) => a.name.localeCompare(b.name));

                    currentItems = [...folderItems, ...children];
                    renderFileList(currentItems, cleanPath);
                } catch (err) {
                    console.error(err);
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:#cf222e;"></i>
                            <p>加载失败: ${escapeHtml(err.message)}</p>
                        </div>
                    `;
                    showToast('加载失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  渲染（通过 data-idx 索引绑定，避免特殊字符路径破坏 HTML 属性）
            // ============================================================
            function renderFileList(items, path) {
                if (!items || items.length === 0) {
                    fileListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>此文件夹为空</p>
                            <p style="font-size:13px;color:#8d96a0;margin-top:4px;">点击「新建文件夹」或拖拽文件上传</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                items.forEach((item, idx) => {
                    const isFolder = (item.type === 'dir');
                    const name = item.name;
                    const size = item.size || 0;
                    const typeName = getTypeName(name, isFolder);
                    const iconHtml = getIconHtml(name, isFolder);
                    const sizeStr = isFolder ? '—' : formatSize(size);
                    const ext = getExtension(name);
                    const extBadge = ext ? `<span class="ext-badge">.${escapeHtml(ext)}</span>` : '';

                    let actionsHtml = '';
                    if (isFolder) {
                        actionsHtml = `<span style="font-size:12px;color:#8d96a0;"><i class="fas fa-chevron-right"></i></span>`;
                    } else {
                        const canPrev = canPreview(name);
                        if (canPrev) {
                            actionsHtml +=
                                `<button class="btn-sm primary" data-action="preview" data-idx="${idx}"><i class="fas fa-eye"></i> <span>预览</span></button>`;
                        }
                        actionsHtml +=
                            `<button class="btn-sm" data-action="download" data-idx="${idx}"><i class="fas fa-download"></i> <span>下载</span></button>`;
                        actionsHtml +=
                            `<button class="btn-sm danger" data-action="delete" data-idx="${idx}"><i class="fas fa-trash"></i> <span>删除</span></button>`;
                    }

                    const rowClass = isFolder ? 'file-item is-folder' : 'file-item';
                    const clickAttr = isFolder ? `data-idx="${idx}"` : '';

                    html += `
                        <div class="${rowClass}" ${clickAttr}>
                            <div class="icon">${iconHtml}</div>
                            <div class="name">${escapeHtml(name)} ${extBadge}</div>
                            <div class="type">${typeName}</div>
                            <div class="size">${sizeStr}</div>
                            <div class="actions">${actionsHtml}</div>
                        </div>
                    `;
                });

                fileListEl.innerHTML = html;

                // 事件绑定：点击文件夹
                fileListEl.querySelectorAll('.file-item.is-folder').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.actions')) return;
                        const item = currentItems[this.dataset.idx];
                        if (item) navigateTo(item.path);
                    });
                });

                // 预览
                fileListEl.querySelectorAll('[data-action="preview"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const item = currentItems[this.dataset.idx];
                        if (item) handlePreview(item);
                    });
                });

                // 下载
                fileListEl.querySelectorAll('[data-action="download"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const item = currentItems[this.dataset.idx];
                        if (item) handleDownload(item);
                    });
                });

                // 删除
                fileListEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const item = currentItems[this.dataset.idx];
                        if (item) handleDelete(item);
                    });
                });
            }

            // ============================================================
            //  导航
            // ============================================================
            function navigateTo(path) {
                const clean = sanitizePath(path);
                if (clean !== currentPath) {
                    loadDirectory(clean);
                }
            }

            // ============================================================
            //  新建文件夹（通过上传 .keep 占位资产）
            // ============================================================
            async function createFolder(folderName) {
                if (!folderName || folderName.trim() === '') {
                    showToast('请输入文件夹名称', 'error');
                    return;
                }
                const name = folderName.trim();
                if (/[\/:*?"<>|\\]/.test(name) || name === '.' || name === '..' || name.endsWith('.')) {
                    showToast('文件夹名称包含非法字符', 'error');
                    return;
                }
                const prefix = currentPath === '/' ? '' : currentPath.slice(1) + '/';
                const folderPath = prefix + name;

                // 已存在检查
                const exists = allAssets.some(a =>
                    a.name === folderPath || a.name.startsWith(folderPath + '/')
                );
                if (exists) {
                    showToast(`文件夹 "${name}" 已存在`, 'error');
                    return;
                }

                try {
                    // 占位内容为一个空格，保证资产非空
                    const emptyBase64 = btoa(' ');
                    await uploadFileViaFunction(folderPath + '/.keep', emptyBase64);
                    showToast(`文件夹 "${name}" 创建成功`, 'success');
                    newFolderDialog.classList.remove('active');
                    loadDirectory(currentPath);
                } catch (err) {
                    showToast('创建失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  上传文件
            // ============================================================
            async function uploadFiles(files) {
                if (!files || files.length === 0) return;

                let success = 0;
                let failed = 0;

                for (const file of files) {
                    try {
                        if (file.size > MAX_FILE_SIZE) {
                            failed++;
                            showToast(`跳过 ${file.name}：超过 4MB 上限（Netlify Function 请求体限制）`, 'error');
                            continue;
                        }
                        const reader = new FileReader();
                        const base64 = await new Promise((resolve, reject) => {
                            reader.onload = () => {
                                // 去掉 data:xxx;base64, 前缀
                                const raw = reader.result.split(',')[1] || reader.result;
                                resolve(raw);
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });

                        const targetPath = currentPath === '/' ? file.name : `${currentPath.slice(1)}/${file.name}`;
                        await uploadFileViaFunction(targetPath, base64);
                        success++;
                    } catch (err) {
                        failed++;
                        console.error(`上传 ${file.name} 失败:`, err);
                        showToast(`上传失败: ${file.name} — ${err.message}`, 'error');
                    }
                }

                if (success > 0) {
                    showToast(`成功上传 ${success} 个文件${failed > 0 ? `，${failed} 个失败` : ''}`, success === files.length ? 'success' :
                        'info');
                    loadDirectory(currentPath);
                } else if (failed > 0) {
                    showToast(`上传失败 ${failed} 个文件`, 'error');
                }
            }

            // ============================================================
            //  预览
            // ============================================================
            function revokePreviewUrl() {
                if (previewObjectUrl) {
                    URL.revokeObjectURL(previewObjectUrl);
                    previewObjectUrl = null;
                }
            }

            async function handlePreview(item) {
                const info = getFileType(item.name);
                const ext = getExtension(item.name);
                const isImage = IMAGE_EXTS.includes(ext);
                const isVideo = VIDEO_EXTS.includes(ext);
                const isAudio = AUDIO_EXTS.includes(ext);

                previewTitle.innerHTML = `<i class="${info.icon}"></i> ${escapeHtml(item.name)}`;
                previewBody.innerHTML = '<div class="preview-fallback">加载中…</div>';
                previewModal.classList.add('active');
                currentPreviewItem = item;

                try {
                    // 图片优先走 GitHub 直链（公开仓库，不受 Function 体积限制）
                    if (isImage && item.download_url) {
                        const img = document.createElement('img');
                        img.src = item.download_url;
                        img.alt = item.name;
                        img.style.maxWidth = '100%';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        previewBody.innerHTML = '';
                        previewBody.appendChild(img);
                        return;
                    }

                    if (item.size > MAX_FILE_SIZE) {
                        previewBody.innerHTML = `
                            <div class="preview-fallback">
                                <i class="fas fa-file" style="font-size:32px;color:#d0d7de;"></i>
                                <p>文件超过 4MB，无法在线预览，请直接下载</p>
                            </div>`;
                        return;
                    }

                    const resp = await fetch(`${API_BASE}/preview?path=${encodeURIComponent(item.path)}`);
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        throw new Error(err.error || `预览失败 (${resp.status})`);
                    }
                    const blob = await resp.blob();

                    revokePreviewUrl();
                    previewObjectUrl = URL.createObjectURL(blob);

                    if (isImage) {
                        previewBody.innerHTML = `<img src="${previewObjectUrl}" alt="preview" style="max-width:100%;display:block;margin:0 auto;">`;
                    } else if (isVideo) {
                        previewBody.innerHTML = `<video src="${previewObjectUrl}" controls autoplay style="max-width:100%;display:block;margin:0 auto;"></video>`;
                    } else if (isAudio) {
                        previewBody.innerHTML = `<audio src="${previewObjectUrl}" controls style="width:100%;"></audio>`;
                    } else {
                        const text = await blob.text();
                        previewBody.innerHTML = `<pre style="margin:0;font-family:inherit;white-space:pre-wrap;word-break:break-word;">${escapeHtml(text)}</pre>`;
                    }
                } catch (err) {
                    previewBody.innerHTML = `
                        <div class="preview-fallback">
                            <i class="fas fa-exclamation-triangle" style="color:#cf222e;"></i>
                            <p>预览失败: ${escapeHtml(err.message)}</p>
                        </div>`;
                }
            }

            // ============================================================
            //  下载（小文件经 Function 中转以获得正确文件名，
            //  大文件回退 GitHub 直链）
            // ============================================================
            function triggerDownload(url, name) {
                const a = document.createElement('a');
                a.href = url;
                a.download = name || '';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            async function handleDownload(item) {
                try {
                    if (item.size > MAX_FILE_SIZE) {
                        if (item.download_url) {
                            showToast('文件较大，走直链下载（保存的文件名可能显示为编码后的名称）', 'info');
                            triggerDownload(item.download_url, item.name);
                            return;
                        }
                    }
                    const resp = await fetch(`${API_BASE}/preview?path=${encodeURIComponent(item.path)}`);
                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        throw new Error(err.error || `下载失败 (${resp.status})`);
                    }
                    const blob = await resp.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    triggerDownload(blobUrl, item.name);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
                } catch (err) {
                    showToast('下载失败: ' + err.message, 'error');
                    if (item.download_url) {
                        triggerDownload(item.download_url, item.name);
                    }
                }
            }

            // ============================================================
            //  删除（需要管理员密码）
            // ============================================================
            async function handleDelete(item) {
                const password = prompt('请输入管理员密码以删除文件：');
                if (password === null) return; // 取消
                if (!password.trim()) {
                    showToast('密码不能为空', 'error');
                    return;
                }
                try {
                    await deleteFileViaFunction(item.path, password.trim());
                    showToast(`文件 "${item.name}" 已删除`, 'success');
                    loadDirectory(currentPath);
                } catch (err) {
                    showToast('删除失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  事件绑定
            // ============================================================

            // 返回上级目录
            upBtn.addEventListener('click', () => {
                if (currentPath !== '/') {
                    loadDirectory(getParentPath(currentPath));
                }
            });

            // 刷新
            refreshBtn.addEventListener('click', () => loadDirectory(currentPath));

            // 新建文件夹
            newFolderBtn.addEventListener('click', () => {
                newFolderDialog.classList.add('active');
                folderNameInput.value = '';
                setTimeout(() => folderNameInput.focus(), 100);
            });

            dialogCancelBtn.addEventListener('click', () => {
                newFolderDialog.classList.remove('active');
            });

            dialogConfirmBtn.addEventListener('click', () => {
                const name = folderNameInput.value.trim();
                if (name) createFolder(name);
                else showToast('请输入文件夹名称', 'error');
            });

            folderNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') dialogConfirmBtn.click();
                if (e.key === 'Escape') dialogCancelBtn.click();
            });

            newFolderDialog.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) newFolderDialog.classList.remove('active');
            });

            // 上传
            dropZone.addEventListener('click', (e) => {
                if (e.target.closest('input')) return;
                fileInput.click();
            });

            fileInput.addEventListener('change', function() {
                if (this.files && this.files.length > 0) {
                    uploadFiles(this.files);
                    this.value = '';
                }
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    uploadFiles(files);
                }
            });

            // 预览模态框关闭
            function closePreview() {
                previewModal.classList.remove('active');
                currentPreviewItem = null;
                revokePreviewUrl();
            }
            previewCloseBtn.addEventListener('click', closePreview);
            previewCloseBtn2.addEventListener('click', closePreview);
            previewModal.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closePreview();
            });

            // 预览中的下载按钮
            previewDownloadBtn.addEventListener('click', function() {
                if (currentPreviewItem) {
                    handleDownload(currentPreviewItem);
                } else {
                    showToast('无法获取文件信息', 'error');
                }
            });

            // ESC 关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (previewModal.classList.contains('active')) closePreview();
                    if (newFolderDialog.classList.contains('active')) newFolderDialog.classList.remove('active');
                }
            });

            // ============================================================
            //  初始化
            // ============================================================
            loadDirectory('/');
        })();
    </script>
</body>
</html>
